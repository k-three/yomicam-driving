name: デプロイ（GitHub Pages）

# main に入った変更を、検査してから公開する。
# 検査（型・集計・ブラウザ）が通らないものは公開しない。
# 公開には GitHub が発行する一時的な権限を使うので、鍵や Secrets の設定は要らない。
# main への push では対象ファイルを絞らない。絞ると、履歴を作り直したときなどに
# 「変更なし」と判定されて公開されず、原因が分かりにくい形で止まるため。
on:
  push:
    branches: [main]
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

# 公開に必要な最小限の権限だけを与える
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1度に1つだけ。走行中のものは最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: 検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 型チェックとビルド
        run: npm run build
      - name: 集計ロジックの検証
        run: npm test
      - name: セキュリティルールの検証
        run: npm run test:rules
      - name: ブラウザでの確認
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
      # 検査に通った成果物だけを公開の材料として引き渡す
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: app/dist

  deploy:
    name: 公開
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
